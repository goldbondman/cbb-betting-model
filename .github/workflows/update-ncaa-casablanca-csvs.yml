name: Update NCAA Casablanca CSVs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Restore first-run marker cache
        id: first_run_cache
        uses: actions/cache@v4
        with:
          path: .cache/ncaa-casablanca-first-run.marker
          key: ncaa-casablanca-first-run-v1

      - name: Decide DAYS_BACK
        id: days_back
        run: |
          if [ "${{ steps.first_run_cache.outputs.cache-hit }}" = "true" ]; then
            echo "days_back=3" >> "$GITHUB_OUTPUT"
          else
            echo "days_back=100" >> "$GITHUB_OUTPUT"
          fi

      - name: Run NCAA Casablanca builder
        working-directory: ESPN
        env:
          DAYS_BACK: ${{ steps.days_back.outputs.days_back }}
        run: |
          echo "Running NCAA Casablanca pull with DAYS_BACK=${DAYS_BACK}"
          python ncaa_casablanca_builder.py

      - name: Persist first-run marker
        if: ${{ steps.first_run_cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p .cache
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .cache/ncaa-casablanca-first-run.marker

      - name: Show generated NCAA CSVs
        working-directory: ESPN
        run: |
          ls -lh CSV/ncaa_games.csv CSV/ncaa_team_game_logs.csv CSV/ncaa_player_boxscores.csv || true

      - name: Install psycopg for DB operations
        run: |
          pip install psycopg[binary]

      - name: Load NCAA CSVs to Supabase DB (raw schema)
        id: load_ncaa_csv
        continue-on-error: true
        working-directory: ESPN
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          UPLOAD_GROUP: "espn"
          DB_SCHEMA: "raw"
          LOAD_MODE: "upsert"
          SKIP_MISSING: "1"
        run: |
          set -o pipefail
          python ../load_csv_to_db.py 2>&1 | tee /tmp/load_ncaa_csv.log

      - name: Report DB load result + schema guidance
        if: ${{ always() }}
        run: |
          echo "DB load step outcome: ${{ steps.load_ncaa_csv.outcome }}"
          if [ "${{ steps.load_ncaa_csv.outcome }}" = "failure" ]; then
            echo "DB load failed. Suggested SQL (if present in logs):"
            awk '/\[SCHEMA_DRIFT_SQL_BEGIN\]/{flag=1;next}/\[SCHEMA_DRIFT_SQL_END\]/{flag=0}flag' /tmp/load_ncaa_csv.log || true
          else
            echo "DB load succeeded."
          fi

      - name: Upload NCAA CSVs to Supabase Storage
        id: upload_ncaa_storage
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          UPLOAD_GROUP: "espn"
          SKIP_MISSING: "1"
        run: |
          python upload_to_supabase_storage.py

      - name: Report Storage upload result
        if: ${{ always() }}
        run: |
          echo "Storage upload step outcome: ${{ steps.upload_ncaa_storage.outcome }}"
