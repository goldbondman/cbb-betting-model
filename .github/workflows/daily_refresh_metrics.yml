name: Daily refresh metrics (Torvik + Haslametrics)

on:
  schedule:
    # 10:00 PM Pacific. GitHub schedules use UTC.
    # PST (UTC-8)  -> 06:00 UTC next day
    # PDT (UTC-7)  -> 05:00 UTC next day
    # This runs at 06:00 UTC daily (10pm PST during standard time).
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh-metrics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-refresh.txt ]; then
            python -m pip install -r requirements-refresh.txt
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install pandas numpy requests beautifulsoup4 lxml html5lib
          fi

      - name: Refresh Torvik + Haslametrics CSVs
        env:
          TZ: America/Los_Angeles
        run: |
          python scripts/refresh_metrics.py

      - name: Show git status
        run: git status --porcelain

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add -A
            git commit -m "Daily refresh: Torvik + Haslametrics CSVs"
            git push
          else
            echo "No changes to commit."
          fi
