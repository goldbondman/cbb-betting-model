name: Daily Refresh Metrics

on:
  schedule:
    # 10:00pm PST = 06:00 UTC (during PDT this will run at 11:00pm local)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # Install main deps first (preferred)
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          # Optional: refresh-specific deps
          if [ -f scripts/requirements-refresh.txt ]; then
            pip install -r scripts/requirements-refresh.txt
          fi

          # Safety net in case neither requirements file exists
          if [ ! -f requirements.txt ] && [ ! -f scripts/requirements-refresh.txt ]; then
            pip install pandas requests beautifulsoup4 lxml
          fi

      - name: Refresh Torvik and Haslametrics CSVs
        env:
          # Keep player-level Torvik output as barttorvik.csv
          TORVIK_PLAYERS_OUT: "barttorvik.csv"
          # Team-level Torvik output
          TORVIK_TEAMS_OUT: "barttorvik_teams.csv"
          # Pin season-ending year (optional but removes ambiguity)
          TORVIK_YEAR: "2026"

          # Haslametrics output
          HASLA_OUT: "haslametrics.csv"
          # Only change if Hasla page table order changes
          HASLA_TABLE_INDEX: "0"
        run: |
          python scripts/refresh_sources.py

      - name: Commit and push updated CSVs
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Daily refresh: update Torvik and Haslametrics data"
            git push
          else
            echo "No changes to commit."
          fi
