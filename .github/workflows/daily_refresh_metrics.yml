name: Daily Refresh Metrics

on:
  schedule:
    - cron: "0 6 * * *"  # 10:00pm PST (UTC is used by GitHub Actions)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh-metrics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements-refresh.txt ]; then pip install -r scripts/requirements-refresh.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Refresh Torvik and Haslametrics sources
        env:
          TORVIK_URL: "https://barttorvik.com/2026_team_results.csv"
          HASLA_URL: "https://www.haslametrics.com/ratings.php?yr=2025"
        run: |
          python scripts/refresh_sources.py

      - name: Commit and push if files changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Daily refresh: Torvik + Haslametrics CSVs"
          git push
