name: Daily refresh metrics (Torvik + Haslametrics)

on:
  schedule:
    # 10:00 PM America/Los_Angeles = 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug repo structure (quick)
        run: |
          echo "PWD: $(pwd)"
          ls -la
          echo ""
          echo "scripts/:"
          ls -la scripts || true
          echo ""
          test -f scripts/refresh_sources.py && echo "Found scripts/refresh_sources.py ✅" || (echo "Missing scripts/refresh_sources.py ❌" && exit 1)

      - name: Refresh Torvik + Haslametrics CSVs
        run: |
          set -e
          python scripts/refresh_sources.py

      - name: Commit and push updated files (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git status
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Daily refresh: Torvik + Haslametrics sources"
          git push
