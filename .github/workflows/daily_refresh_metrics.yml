name: Daily Refresh Metrics

on:
  schedule:
    # 10:00pm PST = 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure main
        run: git checkout main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml
          pip install psycopg[binary]

      - name: Install Node.js (for cbb-api)
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install cbb-api CLI
        run: |
          npm install -g cbb-api

      - name: Fetch CBB API team data (required order)
        env:
          CBB_DATA_API_KEY: ${{ secrets.CBB_DATA_API_KEY }}
        run: |
          mkdir -p data/cbbapi

          # REQUIRED FIRST: teams list
          cbb --teams --season 2026 --output-dir data/cbbapi

          # Team efficiency / season metrics
          cbb --team-season-stats --season 2026 --output-dir data/cbbapi

          # Team shooting / four-factor style stats
          cbb --team-shooting-stats --season 2026 --output-dir data/cbbapi

      - name: Refresh Torvik player + team results (optional but useful)
        env:
          TORVIK_YEAR: "2026"
        run: |
          python scripts/refresh_sources.py

      - name: Commit and push updated data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure we have the latest remote main before pushing
          git fetch origin main

          # Commit changes if any
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Daily refresh: CBB API + Torvik data"
          else
            echo "No changes to commit."
            exit 0
          fi

          # Rebase our commit on top of origin/main to avoid push rejection
          git rebase origin/main

          # Push explicitly to main
          git push origin HEAD:main

      - name: Upload Torvik outputs to Supabase Storage (skip missing)
        id: load_torvik_csv
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          UPLOAD_GROUP: "torvik"
          SKIP_MISSING: "1"
        run: |
          set -o pipefail
          python load_csv_to_db.py 2>&1 | tee /tmp/load_torvik_csv.log

      - name: Report DB load result + schema guidance
        if: ${{ always() }}
        run: |
          echo "DB load step outcome: ${{ steps.load_torvik_csv.outcome }}"
          if [ "${{ steps.load_torvik_csv.outcome }}" != "success" ]; then
            echo "DB load failed. Suggested SQL (if present in logs):"
            awk '/\[SCHEMA_DRIFT_SQL_BEGIN\]/{flag=1;next}/\[SCHEMA_DRIFT_SQL_END\]/{flag=0}flag' /tmp/load_torvik_csv.log || true
          else
            echo "DB load succeeded."
          fi
