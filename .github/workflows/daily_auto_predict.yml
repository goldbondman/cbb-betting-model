name: Daily Auto Predict

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch: {}

jobs:
  auto-predict:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MODEL_VERSION: ${{ secrets.MODEL_VERSION }}
      EDGE_MIN: "3.0"
      EDGE_TIER2: "6.0"
      EDGE_TIER3: "9.0"
      DAYS_AHEAD: "1"
      DAYS_BACK: "3"
      RAW_SCHEMA: "raw"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Safety net in case requirements.txt doesn't include these (harmless if already installed)
          pip install pandas numpy requests psycopg[binary]

      - name: Run ESPN builder (3-day backfill)
        run: |
          python espn_boxscore_builder.py
        env:
          DAYS_BACK: ${{ env.DAYS_BACK }}

      - name: Verify feature store exists
        run: |
          ls -lh *.csv *.json || true
          test -f espn_team_game_features.csv

      - name: Run daily auto prediction
        run: |
          python scripts/daily_auto_predict.py
