name: Daily Auto Predict

on:
  workflow_run:
    workflows: ["Run ML pipeline"]
    types: [completed]
  workflow_dispatch: {}
  schedule:
    - cron: "0 15 * * *"

jobs:
  auto-predict:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MODEL_VERSION: ${{ secrets.MODEL_VERSION }}
      EDGE_MIN: "3.0"
      EDGE_TIER2: "6.0"
      EDGE_TIER3: "9.0"
      DAYS_AHEAD: "1"
      RAW_SCHEMA: "raw"
      RAW_PREDICTIONS_SCHEMA: "raw"
      RAW_PREDICTIONS_TABLE: "predictions_latest"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg[binary]

      - name: Run daily auto prediction (DB-backed)
        run: |
          python scripts/daily_auto_predict.py
