name: Update ESPN CSVs

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: "Days of scoreboard history to process (use 120 for one-time backfill)"
        required: false
        default: "3"
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download previous ESPN CSVs
        uses: actions/download-artifact@v4
        with:
          name: espn-csvs
          path: ESPN/CSV/
        continue-on-error: true

      - name: Clear legacy repo-local checkpoint files
        run: |
          rm -f ESPN/espn_pipeline_checkpoint.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests psycopg[binary]

      - name: Run ESPN builder (configurable window)
        working-directory: ESPN
        run: |
          python espn_boxscore_builder_modular.py
        env:
          ENABLE_CBBPY: "0"
          DAYS_BACK: ${{ inputs.days_back || '3' }}
          CHECKPOINT_FILE: "/tmp/espn_pipeline_checkpoint.json"
          RECONCILIATION_MAX_RETRIES: "2"
          RECONCILIATION_RETRY_DELAY: "3.0"
          RECONCILIATION_MIN_COMPLETION_RATE: "0.95"

      - name: Validate data completeness
        working-directory: ESPN
        run: |
          python -c "
          import pandas as pd, sys, os
          games = os.path.join('CSV', 'espn_games.csv')
          logs  = os.path.join('CSV', 'espn_team_game_logs.csv')
          if not os.path.exists(games) or not os.path.exists(logs):
              print('[WARN] CSV files missing, skipping validation')
              sys.exit(0)
          gdf = pd.read_csv(games)
          ldf = pd.read_csv(logs)
          completed = gdf[gdf['completed'].astype(bool)]
          sb_ids = set(completed['game_id'].astype(str).unique())
          log_ids = set(ldf['event_id'].astype(str).unique())
          missing = sb_ids - log_ids
          print(f'Completed games in scoreboard: {len(sb_ids)}')
          print(f'Games in team logs:            {len(log_ids)}')
          print(f'Missing from logs:             {len(missing)}')
          if missing:
              for m in sorted(missing)[:30]:
                  print(f'  MISSING: {m}')
              rate = 1 - len(missing)/max(1,len(sb_ids))
              print(f'Completion rate: {rate*100:.1f}%')
              if rate < 0.95:
                  print('[FAIL] Completion rate below 95%')
                  sys.exit(1)
          else:
              print('[OK] All completed scoreboard games have team log rows')
          "

      - name: Fetch ESPN injuries (NCAA APIs)
        working-directory: ESPN
        run: |
          python fetch_injuries.py

      - name: Ensure optional artifacts exist
        working-directory: ESPN
        run: |
          test -f espn_pipeline_errors.json || echo '{"run_ts_utc":"", "total_errors":0, "errors":[]}' > espn_pipeline_errors.json

      - name: Show file sizes
        working-directory: ESPN
        run: |
          ls -lh CSV/*.csv *.json || true

      - name: Audit ESPN CSV output
        id: csv_audit
        continue-on-error: true
        run: |
          python scripts/audit_espn_csv_output.py --csv-dir ESPN/CSV

      - name: Recover missing CSVs from Supabase Storage
        if: ${{ steps.csv_audit.outcome == 'failure' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: |
          python scripts/recover_espn_csvs_from_storage.py --csv-dir ESPN/CSV

      - name: Re-audit after recovery
        if: ${{ steps.csv_audit.outcome == 'failure' }}
        run: |
          python scripts/audit_espn_csv_output.py --csv-dir ESPN/CSV

      - name: Upload ESPN CSV artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: espn-csvs
          path: ESPN/CSV/*.csv
          if-no-files-found: warn

      - name: Load outputs to Supabase DB (raw schema)
        id: load_espn_csv
        continue-on-error: true
        working-directory: ESPN
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          UPLOAD_GROUP: "espn"
          DB_SCHEMA: "raw"
          LOAD_MODE: "upsert"
          SKIP_MISSING: "0"
        run: |
          set -o pipefail
          python ../load_csv_to_db.py 2>&1 | tee /tmp/load_espn_csv.log

      - name: Report DB load result + schema guidance
        if: ${{ always() }}
        run: |
          echo "DB load step outcome: ${{ steps.load_espn_csv.outcome }}"
          if [ "${{ steps.load_espn_csv.outcome }}" = "failure" ]; then
            echo "DB load failed. Suggested SQL (if present in logs):"
            awk '/\[SCHEMA_DRIFT_SQL_BEGIN\]/{flag=1;next}/\[SCHEMA_DRIFT_SQL_END\]/{flag=0}flag' /tmp/load_espn_csv.log || true
          else
            echo "DB load succeeded."
          fi

      - name: Upload ESPN CSVs to Supabase Storage
        id: upload_espn_storage
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          UPLOAD_GROUP: "espn"
          SKIP_MISSING: "1"
        run: |
          python upload_to_supabase_storage.py

      - name: Report Storage upload result
        if: ${{ always() }}
        run: |
          echo "Storage upload step outcome: ${{ steps.upload_espn_storage.outcome }}"
