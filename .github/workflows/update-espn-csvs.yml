name: Update ESPN CSVs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run ESPN builder (100-day backfill)
        run: |
          python espn_boxscore_builder.py
        env:
          DAYS_BACK: "100"

      - name: Show file sizes
        run: |
          ls -lh espn_games.csv espn_team_game_logs.csv espn_team_game_features.csv espn_matchups_model_ready.csv

      - name: Upload CSVs to Supabase Storage (public bucket)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: |
          python upload_to_supabase_storage.py
