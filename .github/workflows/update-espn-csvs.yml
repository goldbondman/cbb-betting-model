name: Update ESPN CSVs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run ESPN builder (100-day backfill)
        run: |
          python espn_boxscore_builder.py
        env:
          DAYS_BACK: "100"

      - name: Ensure optional artifacts exist
        run: |
          test -f espn_pipeline_errors.json || echo '{"run_ts_utc":"", "total_errors":0, "errors":[]}' > espn_pipeline_errors.json

      - name: Show file sizes
        run: |
          ls -lh *.csv *.json || true

      - name: Upload outputs to Supabase Storage (public bucket)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: |
          python upload_to_supabase_storage.py
