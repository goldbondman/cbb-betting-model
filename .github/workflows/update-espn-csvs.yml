name: Update ESPN CSVs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests psycopg[binary]

      - name: Run ESPN builder (110-day backfill)
        run: |
          python espn_boxscore_builder.py
        env:
          DAYS_BACK: "110"

      - name: Ensure optional artifacts exist
        run: |
          test -f espn_pipeline_errors.json || echo '{"run_ts_utc":"", "total_errors":0, "errors":[]}' > espn_pipeline_errors.json

      - name: Show file sizes
        run: |
          ls -lh *.csv *.json || true

      - name: Load outputs to Supabase DB (raw schema)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          UPLOAD_GROUP: "espn"
          DB_SCHEMA: "raw"
          LOAD_MODE: "upsert"
          SKIP_MISSING: "0"
        run: |
          python load_csv_to_db.py
