name: Update ESPN CSVs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run ESPN builder (80-day backfill)
        run: |
          python espn_boxscore_builder.py
        env:
          DAYS_BACK: "80"

      - name: Show file sizes
        run: |
          ls -lh espn_games.csv espn_team_game_logs.csv

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add espn_games.csv espn_team_game_logs.csv
          git diff --cached --quiet || git commit -m "Update ESPN CSVs"
          git push
