name: Train ML Variants

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * SUN"

jobs:
  train_variants:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg[binary]

      - name: Build feature matrix (DB-backed)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_SCHEMA: "raw"
          ESPN_FEATURES_TABLE: "espn_team_game_core"
        run: |
          python scripts/build_espn_team_game_core.py
          python ml/pipeline.py

      - name: Generate feature matrix files (DB-backed)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_SCHEMA: "raw"
          ESPN_FEATURES_TABLE: "espn_team_game_core"
        run: |
          python scripts/build_espn_team_game_core.py
          python ml/feature_matrix.py

      - name: Verify model_features.csv exists
        run: |
          ls -lh ml/model_features.csv
          head -n 1 ml/model_features.csv

      - name: Train lookback variants and ensembles
        run: |
          python ml/train_variants.py

      - name: Show variant artifacts
        run: |
          ls -lh ml/variant_results.csv ml/models || true

      - name: Upload summary CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: variant-results
          path: ml/variant_results.csv
