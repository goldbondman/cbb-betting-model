name: R1 state dispersion and finalist
on:
  push:
    paths: ['.github/workflows/export-ncaa-team-box.yml']
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy
      - name: Run dispersion calibration
        run: |
          cat > /tmp/run.py <<'PY'
          import pandas as pd,numpy as np,json
          RAW="https://raw.githubusercontent.com/sportsdataverse/ncaa-mbb-hoops-data/main/"
          # games
          tb=[]
          for sy in range(2021,2026):
            d=pd.read_parquet(RAW+f"mbb/team_box/parquet/ncaa_mbb_team_box_{sy}.parquet");d["season"]=sy;tb.append(d)
          G=pd.concat(tb,ignore_index=True);S=pd.read_parquet(RAW+"mbb/ncaa_mbb_schedule_master.parquet")
          def col(df,o):
            z=next((c for c in o if c in df.columns),None)
            if z is None: raise Exception(o)
            return z
          gid=col(G,["contest_id","game_id"]);tm=col(G,["team","team_name","team_display_name"]);pts=col(G,["pts","points"]);poss=col(G,["o_poss","offensive_possessions"])
          G=G.rename(columns={gid:"game_id",tm:"team",pts:"pts",poss:"poss"});G["ortg"]=100*pd.to_numeric(G.pts,errors="coerce")/pd.to_numeric(G.poss,errors="coerce")
          sg=col(S,["contest_id","game_id"]);sd=col(S,["date","game_date","start_date"])
          G=G.merge(S[[sg,sd]].drop_duplicates(sg).rename(columns={sg:"game_id",sd:"date"}),on="game_id",how="left");G["date"]=pd.to_datetime(G.date,errors="coerce")
          G=G.dropna(subset=["date","ortg"]).sort_values(["date","game_id","team"]);q=G[["game_id","team"]].copy();q["ix"]=q.groupby("game_id").cumcount();o=q.copy();o["ix"]=1-o.ix;o=o.rename(columns={"team":"opp"});G["ix"]=G.groupby("game_id").cumcount();G=G.merge(o,on=["game_id","ix"]);G=G[G.groupby("game_id").game_id.transform("size")==2]
          # Evaluate learning rate K, state stretch gamma applied only at season transition, and carry <=1.
          specs=[]
          for k in [.06,.08,.10,.12,.14,.16]:
            for gamma in [.85,1.0,1.10,1.20,1.30,1.40]:
              for carry in [.70,.80,.90,1.0]:
                specs.append((k,gamma,carry))
          out=[]
          for k,gamma,carry in specs:
            O={};D={};prev=None;pred=[]
            for date,day in G.groupby("date",sort=True):
              sy=int(day.season.iloc[0])
              if prev is None:prev=sy
              if sy!=prev:
                factor=gamma*carry
                O={t:v*factor for t,v in O.items()};D={t:v*factor for t,v in D.items()};prev=sy
              ups=[]
              for _,r in day.iterrows():
                p=100+O.get(r.team,0)-D.get(r.opp,0)
                if sy>=2022:pred.append((sy,r.game_id,r.ortg,p))
                e=r.ortg-p;ups.append((r.team,r.opp,e))
              for a,b,e in ups:O[a]=O.get(a,0)+k*e;D[b]=D.get(b,0)-k*e
            X=pd.DataFrame(pred,columns=["season","game_id","actual","pred"]);X["ae"]=(X.actual-X.pred).abs();X["err"]=X.actual-X.pred
            gd=X.groupby(["season","game_id"]).err.agg(lambda x:abs(x.iloc[0]-x.iloc[1]) if len(x)==2 else np.nan)
            rec={"k":k,"gamma":gamma,"carry":carry,"net_transition":gamma*carry,"ortg_mae":X.ae.mean(),"diff_mae":gd.mean()}
            for sy in range(2022,2026):rec[f"o{sy}"]=X.loc[X.season==sy,"ae"].mean();rec[f"d{sy}"]=gd.loc[sy].mean()
            out.append(rec)
          R=pd.DataFrame(out);R.to_csv("dispersion_grid.csv",index=False)
          print("ORTG_TOP");print(R.sort_values("ortg_mae").head(15).to_string(index=False))
          print("DIFF_TOP");print(R.sort_values("diff_mae").head(15).to_string(index=False))
          # identify equivalence by net transition to expose non-identifiability
          E=R.groupby(["k","net_transition"],as_index=False).agg(ortg_mae=("ortg_mae","mean"),diff_mae=("diff_mae","mean"),n=("gamma","size"))
          E.to_csv("transition_equivalence.csv",index=False)
          # within-season terminal state dispersion by K, no offseason transition, relative to next-season first-game residual predictive slope
          # Diagnostic: state scale is not separately identifiable from transition multiplier in this architecture.
          summ={"best_ortg":R.sort_values("ortg_mae").iloc[0].to_dict(),"best_diff":R.sort_values("diff_mae").iloc[0].to_dict()}
          open("summary.json","w").write(json.dumps(summ,default=float,indent=2))
          PY
          python /tmp/run.py
      - uses: actions/upload-artifact@v7
        with:
          name: r1-dispersion
          path: |
            dispersion_grid.csv
            transition_equivalence.csv
            summary.json
          retention-days: 7
