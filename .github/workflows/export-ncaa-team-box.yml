name: R2 opponent information weighting
on:
  push:
    paths: ['.github/workflows/export-ncaa-team-box.yml']
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy
      - name: Test opponent strength and certainty weighting
        run: |
          cat > /tmp/r2opp.py <<'PY'
          import pandas as pd,numpy as np
          RAW="https://raw.githubusercontent.com/sportsdataverse/ncaa-mbb-hoops-data/main/"
          tb=[]
          for sy in range(2021,2026):
            d=pd.read_parquet(RAW+f"mbb/team_box/parquet/ncaa_mbb_team_box_{sy}.parquet");d["season"]=sy;tb.append(d)
          G=pd.concat(tb,ignore_index=True);S=pd.read_parquet(RAW+"mbb/ncaa_mbb_schedule_master.parquet")
          def col(df,o):
            z=next((c for c in o if c in df.columns),None)
            if z is None:raise Exception(o)
            return z
          gid=col(G,["contest_id","game_id"]);tm=col(G,["team","team_name","team_display_name"]);pts=col(G,["pts","points"]);poss=col(G,["o_poss","offensive_possessions"])
          G=G.rename(columns={gid:"game_id",tm:"team",pts:"pts",poss:"poss"});G["poss"]=pd.to_numeric(G.poss,errors="coerce");G["ortg"]=100*pd.to_numeric(G.pts,errors="coerce")/G.poss
          sg=col(S,["contest_id","game_id"]);sd=col(S,["date","game_date","start_date"])
          G=G.merge(S[[sg,sd]].drop_duplicates(sg).rename(columns={sg:"game_id",sd:"date"}),on="game_id",how="left");G["date"]=pd.to_datetime(G.date,errors="coerce")
          G=G.dropna(subset=["date","ortg","poss"]).sort_values(["date","game_id","team"])
          q=G[["game_id","team"]].copy();q["ix"]=q.groupby("game_id").cumcount();o=q.copy();o["ix"]=1-o.ix;o=o.rename(columns={"team":"opp"})
          G["ix"]=G.groupby("game_id").cumcount();G=G.merge(o,on=["game_id","ix"]);G=G[G.groupby("game_id").game_id.transform("size")==2]
          gp=G.groupby("game_id").poss.mean().rename("gposs");G=G.merge(gp,on="game_id")
          # All challengers retain R2-1 possession weighting. Opponent strength uses |opponent latent net|
          # while certainty uses opponent prior game count. Both are pregame only.
          specs=[
            ("poss_only",0,0),
            ("strength_mild",.08,0),("strength_med",.15,0),
            ("certainty_mild",0,.08),("certainty_med",0,.15),
            ("both_mild",.08,.08)]
          out=[];diag=[]
          for name,bs,bc in specs:
            O={};D={};n={};prev=None;pred=[]
            for date,day in G.groupby("date",sort=True):
              sy=int(day.season.iloc[0])
              if prev is None:prev=sy
              if sy!=prev:
                O={t:v*1.20 for t,v in O.items()};D={t:v*1.20 for t,v in D.items()};n={};prev=sy
              ups=[]
              for _,r in day.iterrows():
                oa=O.get(r.team,0);db=D.get(r.opp,0);p=100+oa-db
                opp_net=O.get(r.opp,0)-D.get(r.opp,0);oppn=n.get(r.opp,0)
                # strength factor symmetric in absolute latent quality, centered softly around 8 points
                sf=np.clip(1+bs*((abs(opp_net)-8)/8),.80,1.20)
                # certainty: first games attenuated, mature opponents modestly upweight
                maturity=np.clip(oppn/10,0,1)
                cf=1+bc*(2*maturity-1)
                w=np.clip((r.gposs/70)*sf*cf,.50,1.50)
                if sy>=2022:pred.append((sy,r.game_id,r.team,r.gposs,opp_net,oppn,r.ortg,p,w))
                e=r.ortg-p;ups.append((r.team,r.opp,e,w))
              for a,b,e,w in ups:
                k=.12*w;O[a]=O.get(a,0)+k*e;D[b]=D.get(b,0)-k*e;n[a]=n.get(a,0)+1
            X=pd.DataFrame(pred,columns=["season","game_id","team","poss","oppnet","oppn","actual","pred","w"]);X["ae"]=(X.actual-X.pred).abs();X["err"]=X.actual-X.pred
            gd=X.groupby(["season","game_id"]).err.agg(lambda x:abs(x.iloc[0]-x.iloc[1]) if len(x)==2 else np.nan)
            rec={"spec":name,"ortg":X.ae.mean(),"diff":gd.mean(),"mean_w":X.w.mean()}
            for sy in range(2022,2026):rec[f"d{sy}"]=gd.loc[sy].mean()
            out.append(rec)
            if name=="poss_only":
              X["opp_strength_bin"]=pd.qcut(X.oppnet.abs().rank(method="first"),4,labels=False)
              X["opp_maturity_bin"]=pd.cut(X.oppn,[-1,2,5,10,999],labels=["0-2","3-5","6-10","11+"])
              for c in ["opp_strength_bin","opp_maturity_bin"]:
                for b,g in X.groupby(c,observed=True):diag.append({"dimension":c,"bucket":str(b),"n":len(g),"mae":g.ae.mean()})
          R=pd.DataFrame(out);Q=pd.DataFrame(diag);print("RESULTS");print(R.sort_values("diff").to_string(index=False));print("DIAGNOSTICS");print(Q.to_string(index=False))
          R.to_csv("r2_opponent_weight.csv",index=False);Q.to_csv("r2_opponent_diag.csv",index=False)
          PY
          python /tmp/r2opp.py
      - uses: actions/upload-artifact@v7
        with:
          name: r2-opponent-weight
          path: |
            r2_opponent_weight.csv
            r2_opponent_diag.csv
          retention-days: 7
