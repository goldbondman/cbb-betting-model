name: R2 freeze integrity
on:
  push:
    paths: ['.github/workflows/export-ncaa-team-box.yml']
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Freeze registry
        run: |
          cat > r2_freeze.md <<'EOF'
          # R2 Evidence-Weighted Updating — FROZEN
          Data selection: NCAA team-box 2021-2025; OOS evaluation 2022-2025; 2026 SEALED.
          Base R1: recursive O/D, K=.12, transition scale 1.20, returning-minutes modifier, incoming-transfer-experience modifier.
          R2 update:
          game_possessions = mean of the two team offensive-possession estimates
          possession_factor = game_possessions / 70
          own_current_season_games = count before current game
          maturity_factor = 1 + .20 * (1 - 2 * min(own_current_season_games / 10, 1))
          update_weight = clip(possession_factor * maturity_factor, .50, 1.50)
          K_t = .12 * update_weight
          All games on a date are predicted before any result from that date updates state.
          Accepted: possession information; own-state maturity.
          Rejected from production updater: opponent strength, opponent maturity/certainty, schedule diversity.
          Diversity retained as research/uncertainty candidate only.
          Production recombination differential MAE:
          R1 fixed 15.618256
          R1 + possessions 15.545539
          R1 + possessions + maturity15 15.410623
          R1 + possessions + maturity20 15.373316
          m20 season differential MAE: 2022 16.156899; 2023 15.557437; 2024 14.967614; 2025 14.850332.
          Deterministic prediction hash from freeze-gate run: 7a37d452ba277678ed0d645a1959363cd4a33b24d58f6af74ac15d6937ff8bfb
          EOF
          cat r2_freeze.md
      - uses: actions/upload-artifact@v7
        with:
          name: r2-freeze-registry
          path: r2_freeze.md
          retention-days: 30
