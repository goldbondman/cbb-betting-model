name: R2 maturity diversity gate
on:
  push:
    paths: ['.github/workflows/export-ncaa-team-box.yml']
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy
      - name: Test own maturity and schedule diversity
        run: |
          cat > /tmp/r2m.py <<'PY'
          import pandas as pd,numpy as np
          RAW="https://raw.githubusercontent.com/sportsdataverse/ncaa-mbb-hoops-data/main/"
          tb=[]
          for sy in range(2021,2026):
            d=pd.read_parquet(RAW+f"mbb/team_box/parquet/ncaa_mbb_team_box_{sy}.parquet");d["season"]=sy;tb.append(d)
          G=pd.concat(tb,ignore_index=True);S=pd.read_parquet(RAW+"mbb/ncaa_mbb_schedule_master.parquet")
          def col(df,o):
            z=next((c for c in o if c in df.columns),None)
            if z is None:raise Exception(o)
            return z
          gid=col(G,["contest_id","game_id"]);tm=col(G,["team","team_name","team_display_name"]);pts=col(G,["pts","points"]);poss=col(G,["o_poss","offensive_possessions"])
          G=G.rename(columns={gid:"game_id",tm:"team",pts:"pts",poss:"poss"});G["poss"]=pd.to_numeric(G.poss,errors="coerce");G["ortg"]=100*pd.to_numeric(G.pts,errors="coerce")/G.poss
          sg=col(S,["contest_id","game_id"]);sd=col(S,["date","game_date","start_date"])
          G=G.merge(S[[sg,sd]].drop_duplicates(sg).rename(columns={sg:"game_id",sd:"date"}),on="game_id",how="left");G["date"]=pd.to_datetime(G.date,errors="coerce")
          G=G.dropna(subset=["date","ortg","poss"]).sort_values(["date","game_id","team"])
          q=G[["game_id","team"]].copy();q["ix"]=q.groupby("game_id").cumcount();o=q.copy();o["ix"]=1-o.ix;o=o.rename(columns={"team":"opp"})
          G["ix"]=G.groupby("game_id").cumcount();G=G.merge(o,on=["game_id","ix"]);G=G[G.groupby("game_id").game_id.transform("size")==2]
          gp=G.groupby("game_id").poss.mean().rename("gposs");G=G.merge(gp,on="game_id")
          specs=[
            ("poss_only","none",0),
            ("own_decay_mild","decay",.08),("own_decay_med","decay",.15),
            ("own_grow_mild","grow",.08),("own_grow_med","grow",.15),
            ("diversity_mild","div",.08),("diversity_med","div",.15)]
          out=[];diag=[]
          for name,mode,b in specs:
            O={};D={};n={};seen={};prev=None;pred=[]
            for date,day in G.groupby("date",sort=True):
              sy=int(day.season.iloc[0])
              if prev is None:prev=sy
              if sy!=prev:
                O={t:v*1.20 for t,v in O.items()};D={t:v*1.20 for t,v in D.items()};n={};seen={};prev=sy
              ups=[]
              for _,r in day.iterrows():
                p=100+O.get(r.team,0)-D.get(r.opp,0);ownn=n.get(r.team,0)
                maturity=np.clip(ownn/10,0,1)
                # diversity: unique opponents / games, with repeat opponents lowering information modestly
                st=seen.get(r.team,set());div=len(st)/max(ownn,1) if ownn else 1.0
                extra=1.0
                if mode=="decay": extra=1+b*(1-2*maturity) # early faster, mature slower
                elif mode=="grow": extra=1+b*(2*maturity-1) # early slower, mature faster
                elif mode=="div": extra=1+b*(2*div-1)
                w=np.clip((r.gposs/70)*extra,.50,1.50)
                if sy>=2022:pred.append((sy,r.game_id,r.team,ownn,div,r.ortg,p,w))
                e=r.ortg-p;ups.append((r.team,r.opp,e,w))
              for a,bop,e,w in ups:
                k=.12*w;O[a]=O.get(a,0)+k*e;D[bop]=D.get(bop,0)-k*e;n[a]=n.get(a,0)+1;seen.setdefault(a,set()).add(bop)
            X=pd.DataFrame(pred,columns=["season","game_id","team","ownn","diversity","actual","pred","w"]);X["ae"]=(X.actual-X.pred).abs();X["err"]=X.actual-X.pred
            gd=X.groupby(["season","game_id"]).err.agg(lambda x:abs(x.iloc[0]-x.iloc[1]) if len(x)==2 else np.nan)
            rec={"spec":name,"ortg":X.ae.mean(),"diff":gd.mean()}
            for sy in range(2022,2026):rec[f"d{sy}"]=gd.loc[sy].mean()
            out.append(rec)
            if name=="poss_only":
              X["maturity"]=pd.cut(X.ownn,[-1,2,5,10,999],labels=["0-2","3-5","6-10","11+"])
              for z,g in X.groupby("maturity",observed=True):diag.append({"bucket":str(z),"n":len(g),"mae":g.ae.mean()})
          R=pd.DataFrame(out);Q=pd.DataFrame(diag);print("RESULTS");print(R.sort_values("diff").to_string(index=False));print("MATURITY_DIAG");print(Q.to_string(index=False))
          R.to_csv("r2_maturity_diversity.csv",index=False);Q.to_csv("r2_maturity_diag.csv",index=False)
          PY
          python /tmp/r2m.py
      - uses: actions/upload-artifact@v7
        with:
          name: r2-maturity-diversity
          path: |
            r2_maturity_diversity.csv
            r2_maturity_diag.csv
          retention-days: 7
