name: P1 narrow capability ablations
on:
  push:
    paths: ['.github/workflows/export-ncaa-team-box.yml']
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy scikit-learn
      - name: P1 narrow capability ablations
        run: |
          cat > /tmp/p1abc.py <<'PY'
import pandas as pd,numpy as np
from sklearn.linear_model import Ridge
from sklearn.preprocessing import StandardScaler
from sklearn.pipeline import make_pipeline
R="https://raw.githubusercontent.com/sportsdataverse/ncaa-mbb-hoops-data/main/"
ps=[];raw=["mins","pts","orb","drb","ast","stl","blk","tov","tpa","fta","rima","fga_unast"]
for sy in range(2021,2026):
 p=pd.read_parquet(R+f"mbb/player_box/parquet/ncaa_mbb_player_box_{sy}.parquet")
 for x in raw:p[x]=pd.to_numeric(p[x],errors="coerce").fillna(0)
 p["pk"]=p.clean_name.fillna(p.player).astype(str).str.lower().str.replace(r"[^a-z0-9]","",regex=True)
 a=p.groupby(["team","pk"],as_index=False)[raw].sum();a["season"]=sy
 for x in raw[1:]:a[x+"40"]=40*a[x]/a.mins.replace(0,np.nan)
 ps.append(a)
P=pd.concat(ps)
tb=[]
for sy in range(2021,2026):
 d=pd.read_parquet(R+f"mbb/team_box/parquet/ncaa_mbb_team_box_{sy}.parquet");d["season"]=sy;tb.append(d)
G=pd.concat(tb);pick=lambda d,o:next(x for x in o if x in d.columns)
tc=pick(G,["team","team_name","team_display_name"]);gid=pick(G,["contest_id","game_id"]);pc=pick(G,["pts","points"]);op=pick(G,["o_poss","offensive_possessions"]);dp=pick(G,["d_poss","defensive_possessions"])
for x in [pc,op,dp]:G[x]=pd.to_numeric(G[x],errors="coerce")
z=G[[gid,tc,pc]].copy();z["ix"]=z.groupby(gid).cumcount();oz=z.copy();oz["ix"]=1-oz.ix;oz=oz.rename(columns={pc:"opp_pts"})
G["ix"]=G.groupby(gid).cumcount();G=G.merge(oz[[gid,"ix","opp_pts"]],on=[gid,"ix"])
TS=G.groupby(["season",tc]).agg(pts=(pc,"sum"),opp=("opp_pts","sum"),op=(op,"sum"),dp=(dp,"sum")).reset_index().rename(columns={tc:"team"});TS["ortg"]=100*TS.pts/TS.op;TS["drtg"]=100*TS.opp/TS.dp;TS["net"]=TS.ortg-TS.drtg
rows=[];role=[x+"40" for x in raw[1:]]
for sy in range(2022,2026):
 a=P[P.season==sy-1];b=P[P.season==sy];a=a.groupby("pk").filter(lambda g:g.team.nunique()==1);b=b.groupby("pk").filter(lambda g:g.team.nunique()==1)
 for team,cg in b.groupby("team"):
  pg=a[a.team==team];ret=pg[pg.pk.isin(cg.pk)];tr=a[(a.pk.isin(cg.pk))&(a.team!=team)];dep=pg[~pg.pk.isin(cg.pk)];den=pg.mins.sum()
  rec={"season":sy,"team":team,"rp_min":ret.mins.sum()/den if den else np.nan,"tr_min":tr.mins.sum()}
  for pref,g in [("ret",ret),("dep",dep),("tr",tr)]:
   w=g.mins;wd=w.sum()
   for x in role:rec[pref+"_"+x]=(g[x]*w).sum()/wd if wd else np.nan
  rows.append(rec)
X=pd.DataFrame(rows).merge(TS[["season","team","ortg","drtg","net"]],on=["season","team"])
PT=TS.copy();PT["season"]+=1;PT=PT.rename(columns={"ortg":"prev_ortg","drtg":"prev_drtg"})
X=X.merge(PT[["season","team","prev_ortg","prev_drtg"]],on=["season","team"]);X["trz"]=X.groupby("season").tr_min.transform(lambda s:(s-s.mean())/(s.std()+1e-9))
base=["prev_ortg","prev_drtg","rp_min","trz"]
groups={"BASE":[],
 "ret_creation":["ret_ast40","ret_fga_unast40","ret_tov40"],
 "ret_shootrim":["ret_tpa40","ret_fta40","ret_rima40"],
 "ret_boardrim":["ret_orb40","ret_drb40","ret_blk40"],
 "dep_creation":["dep_ast40","dep_fga_unast40","dep_tov40"],
 "dep_shootrim":["dep_tpa40","dep_fta40","dep_rima40"],
 "dep_boardrim":["dep_orb40","dep_drb40","dep_blk40"],
 "tr_creation":["tr_ast40","tr_fga_unast40","tr_tov40"],
 "tr_shootrim":["tr_tpa40","tr_fta40","tr_rima40"],
 "tr_boardrim":["tr_orb40","tr_drb40","tr_blk40"]}
out=[]
for target in ["ortg","drtg","net"]:
 for name,extra in groups.items():
  cols=base+extra;pr=[]
  for sy in [2023,2024,2025]:
   A=X[X.season<sy];B=X[X.season==sy];med=A[cols].median()
   m=make_pipeline(StandardScaler(),Ridge(alpha=20)).fit(A[cols].fillna(med),A[target]);pp=m.predict(B[cols].fillna(med))
   pr += [(sy,a,p) for a,p in zip(B[target],pp)]
  Q=pd.DataFrame(pr,columns=["season","a","p"]);Q["ae"]=(Q.a-Q.p).abs();rec={"target":target,"spec":name,"mae":Q.ae.mean()}
  for sy in [2023,2024,2025]:rec[str(sy)]=Q.loc[Q.season==sy,"ae"].mean()
  out.append(rec)
O=pd.DataFrame(out);print("NARROW");print(O.sort_values(["target","mae"]).to_string(index=False));O.to_csv("p1_narrow.csv",index=False)
PY
          python /tmp/p1abc.py
      - uses: actions/upload-artifact@v7
        with:
          name: p1-narrow-capabilities
          path: |
            p1_narrow.csv
          retention-days: 14
