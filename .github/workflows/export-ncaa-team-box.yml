name: Preseason reconstruction source audit
on:
  push:
    paths: ['.github/workflows/export-ncaa-team-box.yml']
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow requests
      - name: Audit available player and roster fields
        run: |
          python - <<'PY'
          import pandas as pd,requests
          R="https://raw.githubusercontent.com/sportsdataverse/ncaa-mbb-hoops-data/main/"
          for sy in [2021,2022,2023,2024,2025]:
            p=pd.read_parquet(R+f"mbb/player_box/parquet/ncaa_mbb_player_box_{sy}.parquet")
            ro=pd.read_parquet(R+f"mbb/team_rosters/parquet/ncaa_mbb_team_rosters_{sy}.parquet")
            print("SEASON",sy,"PLAYER_ROWS",len(p),"ROSTER_ROWS",len(ro))
            if sy==2025:
              print("PLAYER_COLS",list(p.columns))
              print("ROSTER_COLS",list(ro.columns))
          PY
      - name: Write preseason gate registry
        run: |
          cat > preseason_reconstruction_registry.md <<'EOF'
          # P1 Preseason Team Reconstruction
          Objective: reduce Game 1-5 prediction error without contaminating 2026 sealed holdout.
          Evaluation: historical expanding/OOS 2022-2025; primary matchup differential MAE, secondary ORtg MAE; report games 1-2, 3-5, 6-10, 11+ separately.
          Baseline: frozen R1 roster prior + frozen R2 evidence-weighted updater.
          P1A returning-player value: replace returning-minutes-only representation with minutes-weighted prior player production/value. Required ablation.
          P1B departing-value decomposition: quantify quality/role actually lost, beyond minutes lost.
          P1C incoming transfers: prior NCAA opponent-adjusted production, experience, role, portability. Compare to frozen transfer-experience term.
          P1D freshmen/new entrants: historical recruiting/entry priors only if legitimate pregame historical source can be obtained with season-correct provenance.
          P1E projected rotation: infer expected role/minute shares using only information available before season/game.
          P1F coaching changes: historical coach/team transition panel; separate level effect from style/component fingerprint; require incremental OOS value after roster reconstruction.
          P1G development: returning-player age/class/role growth, then coach/program residual development only if repeatable OOS.
          P1H roster capability map: creation, shooting, rim pressure, turnover protection, rebounding, rim defense etc.; hand off to R4 mechanism model.
          P1I preseason uncertainty: roster novelty, unproven minutes, coach/system change, transfer/freshman uncertainty; hand off to R3 distributions.
          Leakage rules: no current-season box performance in preseason priors; no end-of-season roster knowledge if unavailable at prediction date; transfers use prior-season production only; coach/recruiting records must be timestamp-valid.
          Complexity rule: each added layer must beat immediately simpler model across pooled OOS and show non-fragile season/bucket behavior. Failed features remain research metadata, not production.
          Stop rule: do not launch player RAPM, lineup optimization, recruiting scrape, or coach reputation model unless simpler historical ablation demonstrates enough residual value to justify it.
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: preseason-reconstruction-source-audit
          path: preseason_reconstruction_registry.md
          retention-days: 30
