name: R2 possession weighted updating
on:
  push:
    paths: ['.github/workflows/export-ncaa-team-box.yml']
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy
      - name: Test possession information weighting
        run: |
          cat > /tmp/r2.py <<'PY'
          import pandas as pd,numpy as np,hashlib
          RAW="https://raw.githubusercontent.com/sportsdataverse/ncaa-mbb-hoops-data/main/"
          tb=[]
          for sy in range(2021,2026):
            d=pd.read_parquet(RAW+f"mbb/team_box/parquet/ncaa_mbb_team_box_{sy}.parquet");d["season"]=sy;tb.append(d)
          G=pd.concat(tb,ignore_index=True);S=pd.read_parquet(RAW+"mbb/ncaa_mbb_schedule_master.parquet")
          def col(df,o):
            z=next((c for c in o if c in df.columns),None)
            if z is None:raise Exception(o)
            return z
          gid=col(G,["contest_id","game_id"]);tm=col(G,["team","team_name","team_display_name"]);pts=col(G,["pts","points"]);poss=col(G,["o_poss","offensive_possessions"])
          G=G.rename(columns={gid:"game_id",tm:"team",pts:"pts",poss:"poss"})
          G["poss"]=pd.to_numeric(G.poss,errors="coerce");G["ortg"]=100*pd.to_numeric(G.pts,errors="coerce")/G.poss
          sg=col(S,["contest_id","game_id"]);sd=col(S,["date","game_date","start_date"])
          G=G.merge(S[[sg,sd]].drop_duplicates(sg).rename(columns={sg:"game_id",sd:"date"}),on="game_id",how="left");G["date"]=pd.to_datetime(G.date,errors="coerce")
          G=G.dropna(subset=["date","ortg","poss"]).sort_values(["date","game_id","team"])
          q=G[["game_id","team"]].copy();q["ix"]=q.groupby("game_id").cumcount();o=q.copy();o["ix"]=1-o.ix;o=o.rename(columns={"team":"opp"})
          G["ix"]=G.groupby("game_id").cumcount();G=G.merge(o,on=["game_id","ix"]);G=G[G.groupby("game_id").game_id.transform("size")==2]
          # game possession as mean team estimate, clipped only in weighting functions
          gp=G.groupby("game_id").poss.mean().rename("gposs");G=G.merge(gp,on="game_id")
          print("POSS_DIST",G.drop_duplicates("game_id").gposs.describe(percentiles=[.01,.05,.1,.25,.5,.75,.9,.95,.99]).to_dict())
          # R2 isolates updating. Hold R1 transition fixed at 1.20; roster modifiers omitted identically across challengers.
          # weight families are pre-specified, all normalized around 70 possessions.
          funcs={
            "fixed":lambda p:1.0,
            "linear50":lambda p:np.clip(p/70,.50,1.50),
            "linear75":lambda p:np.clip(p/70,.75,1.25),
            "sqrt":lambda p:np.clip(np.sqrt(p/70),.75,1.25),
            "info_var":lambda p:np.clip(np.sqrt(p/70),.85,1.15),
            "binary":lambda p: .90 if p<62 else (1.10 if p>78 else 1.0)
          }
          out=[];buckets=[]
          for name,fn in funcs.items():
            O={};D={};prev=None;pred=[]
            for date,day in G.groupby("date",sort=True):
              sy=int(day.season.iloc[0])
              if prev is None:prev=sy
              if sy!=prev:
                O={t:v*1.20 for t,v in O.items()};D={t:v*1.20 for t,v in D.items()};prev=sy
              ups=[]
              for _,r in day.iterrows():
                p=100+O.get(r.team,0)-D.get(r.opp,0)
                if sy>=2022:pred.append((sy,r.game_id,r.team,r.gposs,r.ortg,p))
                e=r.ortg-p;ups.append((r.team,r.opp,e,r.gposs))
              for a,b,e,pn in ups:
                k=.12*fn(pn);O[a]=O.get(a,0)+k*e;D[b]=D.get(b,0)-k*e
            X=pd.DataFrame(pred,columns=["season","game_id","team","poss","actual","pred"]);X["ae"]=(X.actual-X.pred).abs();X["err"]=X.actual-X.pred
            gd=X.groupby(["season","game_id"]).agg(diff=("err",lambda x:abs(x.iloc[0]-x.iloc[1]) if len(x)==2 else np.nan),poss=("poss","mean"))
            rec={"spec":name,"ortg":X.ae.mean(),"diff":gd["diff"].mean()}
            for sy in range(2022,2026):rec[f"d{sy}"]=gd.loc[sy,"diff"].mean()
            out.append(rec)
            for lab,mask in [("low",gd.poss<62),("normal",(gd.poss>=62)&(gd.poss<=78)),("high",gd.poss>78)]:
              buckets.append({"spec":name,"bucket":lab,"n":int(mask.sum()),"diff":gd.loc[mask,"diff"].mean()})
          R=pd.DataFrame(out);B=pd.DataFrame(buckets);print("RESULTS");print(R.sort_values("diff").to_string(index=False));print("BUCKETS");print(B.pivot(index="bucket",columns="spec",values="diff").to_string())
          R.to_csv("r2_poss_results.csv",index=False);B.to_csv("r2_poss_buckets.csv",index=False)
          PY
          python /tmp/r2.py
      - uses: actions/upload-artifact@v7
        with:
          name: r2-possession-weight
          path: |
            r2_poss_results.csv
            r2_poss_buckets.csv
          retention-days: 7
