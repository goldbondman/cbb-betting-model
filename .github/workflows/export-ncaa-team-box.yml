name: P1A player value feasibility
on:
  push:
    paths: ['.github/workflows/export-ncaa-team-box.yml']
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow numpy
      - name: Build preseason player role/value panel
        run: |
          cat > /tmp/p1a.py <<'PY'
          import pandas as pd,numpy as np
          R="https://raw.githubusercontent.com/sportsdataverse/ncaa-mbb-hoops-data/main/"
          rows=[]
          for sy in range(2021,2026):
            p=pd.read_parquet(R+f"mbb/player_box/parquet/ncaa_mbb_player_box_{sy}.parquet")
            num=["mins","o_poss","pts","orb","drb","ast","stl","blk","tov","pf","fga","tpa","fta","rima","mida","pts_trans","pts_half","fga_unast"]
            for c in num:
              if c in p:p[c]=pd.to_numeric(p[c],errors="coerce").fillna(0)
            p["pk"]=p.clean_name.fillna(p.player).astype(str).str.lower().str.replace(r"[^a-z0-9]","",regex=True)
            agg={c:"sum" for c in num if c in p};z=p.groupby(["team","pk"],as_index=False).agg(agg);z["season"]=sy
            z["ppm40"]=40*z.pts/z.mins.replace(0,np.nan);z["ast40"]=40*z.ast/z.mins.replace(0,np.nan);z["tov40"]=40*z.tov/z.mins.replace(0,np.nan)
            z["orb40"]=40*z.orb/z.mins.replace(0,np.nan);z["blk40"]=40*z.blk/z.mins.replace(0,np.nan);z["tpa40"]=40*z.tpa/z.mins.replace(0,np.nan)
            z["rim40"]=40*z.rima/z.mins.replace(0,np.nan);z["unast40"]=40*z.fga_unast/z.mins.replace(0,np.nan)
            rows.append(z)
          A=pd.concat(rows,ignore_index=True)
          out=[]
          for sy in range(2022,2026):
            prev=A[A.season==sy-1];cur=A[A.season==sy]
            # unique normalized identity only
            pu=prev.groupby("pk").filter(lambda g:g.team.nunique()==1);cu=cur.groupby("pk").filter(lambda g:g.team.nunique()==1)
            m=pu.merge(cu[["pk","team","mins"]],on="pk",suffixes=("_prev","_cur"))
            m["status"]=np.where(m.team_prev==m.team_cur,"returner","transfer")
            for (team,status),g in m.groupby(["team_cur","status"]):
              w=g.mins_prev.clip(lower=0);den=w.sum()
              rec={"season":sy,"team":team,"status":status,"players":len(g),"prior_minutes":den,"current_minutes":g.mins_cur.sum()}
              for c in ["ppm40","ast40","tov40","orb40","blk40","tpa40","rim40","unast40"]:
                rec[c]=(g[c]*w).sum()/den if den else np.nan
              out.append(rec)
          X=pd.DataFrame(out)
          print("PANEL_ROWS",len(X));print("STATUS",X.groupby("status").agg(rows=("team","size"),mean_players=("players","mean"),mean_prior_min=("prior_minutes","mean"),mean_current_min=("current_minutes","mean")).to_string())
          print("FEATURE_COMPLETENESS");print(X[["ppm40","ast40","tov40","orb40","blk40","tpa40","rim40","unast40"]].notna().mean().to_string())
          print("CORRELATIONS_WITH_CURRENT_MINUTES");print(X.select_dtypes("number").corr()["current_minutes"].sort_values(ascending=False).to_string())
          X.to_csv("p1a_player_value_panel.csv",index=False)
          PY
          python /tmp/p1a.py
      - uses: actions/upload-artifact@v7
        with:
          name: p1a-player-value-feasibility
          path: p1a_player_value_panel.csv
          retention-days: 14
