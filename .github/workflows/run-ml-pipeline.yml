name: Run ML pipeline

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update ESPN CSVs"]
    types:
      - completed
  schedule:
    - cron: "0 9 * * *"

jobs:
  ml_pipeline:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg[binary]

      - name: Build feature matrix
        run: python ml/pipeline.py

      - name: Generate feature matrix files
        run: python ml/feature_matrix.py

      - name: Show ML artifact sizes
        run: |
          ls -lh ml/*.csv ml/*.json ml/*.txt ml/models/*.json || true

      - name: Load ML CSV artifacts to Supabase DB (raw schema)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          UPLOAD_GROUP: "ml"
          DB_SCHEMA: "raw"
          LOAD_MODE: "replace"
          SKIP_MISSING: "1"
        run: |
          python load_csv_to_db.py

      - name: Train models
        run: python ml/train_ml_models.py

      - name: Generate predictions
        run: python ml/predict_ml.py

      - name: Load predictions to DB (in case predict step writes predictions_latest.csv)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          UPLOAD_GROUP: "ml"
          DB_SCHEMA: "raw"
          LOAD_MODE: "replace"
          SKIP_MISSING: "1"
        run: |
          python load_csv_to_db.py
